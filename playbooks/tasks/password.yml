- name: Set user password
  hosts: fos_switches
  gather_facts: false

  tasks:

    - name: Change password
      brocade.fos.brocade_security_password:
        credential: "{{ credential }}"
        vfid: -1
        password:
          user_name: "user_name"
          old_password: "password3"
          new_password: "password4"
