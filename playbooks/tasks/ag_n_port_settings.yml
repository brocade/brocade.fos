- name: Configure access gateway N-Port settings
  hosts: fos_switches
  gather_facts: false

  vars:
    n_port_settings:
      reliability_counter: 25

  tasks:
    - name: Ag N-Port settings
      brocade.fos.brocade_access_gateway_n_port_settings:
        credential: "{{ credential }}"
        vfid: -1
        n_port_settings: "{{ n_port_settings }}"
