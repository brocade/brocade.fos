- name: Gather relay server facts
  hosts: fos_switches
  gather_facts: false

  tasks:
    - name: Relay server
      brocade_singleton_obj_facts:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-maps"
        obj_name: "maps-config"

    - name: Print accumulative ansible_facts gathered
      ansible.builtin.debug:
        var: ansible_facts
