- name: Find name server by port type
  hosts: fos_switches
  gather_facts: false

  vars:
    port_type_to_search: "n-port"

  tasks:
    - name: Gather facts
      brocade_list_obj_facts:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-name-server"
        list_name: "fibrechannel-name-server"
        attributes:
          port_type: "{{ port_type_to_search }}"

    - name: Print ansible_facts gathered
      ansible.builtin.debug:
        var: ansible_facts
