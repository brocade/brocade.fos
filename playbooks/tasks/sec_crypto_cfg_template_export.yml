- name: Export security crypto config template
  hosts: fos_switches
  gather_facts: false

  vars:
    action_inputs:
      remote_user_name: user_name
      remote_host_ip: "198.51.100.254"
      remote_user_password: "user_password"
      remote_directory: /directory
      file_transfer_protocol_type: "scp"
      template_name: default_generic
      action: export

  tasks:
    - name: Export template. warning - this task will always change.
      brocade.fos.brocade_security_sec_crypto_cfg_template_action:
        credential: "{{ credential }}"
        vfid: -1
        action_inputs: "{{ action_inputs }}"
