# Note: Please set 'BROCADE_VERSION_PATH' environment variable
# to the version file 'versioning.md'
# By default galaxy collection is installed under ~/.ansible/collections,
# in that case the following example shows how to set the environment variable
# in the Linux system
# export BROCADE_VERSION_PATH=~/.ansible/collections/ansible_collections/brocade/fos/versioning.md

- name: Check module compatibility with switch version
  hosts: fos_switches
  gather_facts: false

  tasks:
    - name: Check module(s) are compatible with the given switch version
      brocade.fos.brocade_module_compatibility:
        credential: "{{ credential }}"
