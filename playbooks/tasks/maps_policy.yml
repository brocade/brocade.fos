- name: Configure MAPS policy
  hosts: fos_switches
  gather_facts: false

  tasks:
    - name: Create my policy
      brocade_maps_maps_policy:
        credential: "{{ credential }}"
        vfid: -1
        maps_policies:
          - name: My_policy
            is_active_policy: false
            rule_list:
              rule:
                - my_rule1
                - my_rule2
