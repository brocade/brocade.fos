- name: Reset SNMP
  hosts: fos_switches
  gather_facts: false

  vars:
    snmp_system:
      default_config:
        default_control:
          - snmpv3

  tasks:
    - name: Change all snmp system configuration
      brocade.fos.brocade_snmp_system:
        credential: "{{ credential }}"
        vfid: -1
        snmp_system: "{{ snmp_system }}"
