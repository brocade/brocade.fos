- name: Configure LDAP role map
  hosts: fos_switches
  gather_facts: false

  tasks:
    - name: Port group configuration
      brocade_security_ldap_role_map:
        credential: "{{ credential }}"
        vfid: -1
        ldap_role_map:
          - ldap_role: ROLE3
            switch_role: admin
          - ldap_role: ROLE2
            switch_role: admin
