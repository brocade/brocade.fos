- name: Download switch configuration
  hosts: fos_switches
  gather_facts: false

  vars:
    configdownload:
      config_upload_download_option: "virtual-fabric"
      config_input_buffer: "copy config_output_buffer value of configupload here"

  tasks:
    - name: Configdownload
      brocade.fos.brocade_scalar_operation:
        credential: "{{ credential }}"
        module_name: "configdownload"
        vfid: -1
        entries: "{{ configdownload }}"
      register: result

    - name: Print initial results gathered
      ansible.builtin.debug:
        var: result.operation_resp

    - name: Pause for few minutes for switch reboot
      ansible.builtin.pause:
        minutes: 5

    - name: Show status after reboot
      brocade.fos.brocade_operation_show_status:
        credential: "{{ credential }}"
        vfid: -1
        show_status:
          message_id: "{{ result.operation_resp.show_status.message_id }}"
      register: status_result
      until: >
        status_result.operation_resp is not defined or
        status_result.operation_resp.show_status.status == "done" or
        status_result.operation_resp.show_status.status == "delivered"
      retries: 100
      delay: 10

    - name: Print show_status end result
      ansible.builtin.debug:
        var: status_result.operation_resp
