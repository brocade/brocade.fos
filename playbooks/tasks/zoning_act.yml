# This playbook is an example of how to use zonedb.yml
# that contains existing defined zone database.
- name: Apply zone database from variables
  hosts: fos_switches
  gather_facts: false

  vars_files:
    - ../vars/zonedb.yml

  tasks:
    - name: Create aliases
      brocade.fos.brocade_zoning_alias:
        credential: "{{ credential }}"
        vfid: -1
        aliases: "{{ aliases }}"
            # aliases_to_delete: "{{ aliases_to_delete }}"

    - name: Create zones
      brocade.fos.brocade_zoning_zone:
        credential: "{{ credential }}"
        vfid: -1
        zones: "{{ zones }}"
            # zones_to_delete: "{{ zones_to_delete }}"

    - name: Create cfgs
      brocade.fos.brocade_zoning_cfg:
        credential: "{{ credential }}"
        vfid: -1
        cfgs: "{{ cfgs }}"
        # cfgs_to_delete: "{{ cfgs_to_delete }}"
        active_cfg: newcfg2

    - name: Default zoning
      brocade.fos.brocade_zoning_default_zone:
        credential: "{{ credential }}"
        vfid: -1
        default_zone_access: allaccess
