- name: Configure MAPS rule policy
  hosts: fos_switches
  gather_facts: false

  vars:
    policyname: my_policy
    rule1: my_rule1
    rule2: my_rule2
    myrule:
      - name: "{{ rule1 }}"
        actions:
          action:
            - "raslog"
        event_severity:
        group_name: "ALL_E_PORTS"
        is_rule_on_rule: false
        logical_operator: "g"
        monitoring_system: "C3TXTO"
        quiet_time: 0
        threshold_value: 1
        time_base: "Min"
      - name: "{{ rule2 }}"
        actions:
          action:
            - "raslog"
        event_severity:
        group_name: "ALL_E_PORTS"
        is_rule_on_rule: false
        logical_operator: "g"
        monitoring_system: "C3TXTO"
        quiet_time: 0
        threshold_value: 1
        time_base: "Min"
    mypolicy:
      - name: "{{ policyname }}"
        is_active_policy: true
        rule_list:
          rule:
            - "{{ rule1 }}"
            - "{{ rule2 }}"

  tasks:
    - name: Check to see if rules are being changed
      brocade.fos.brocade_maps_rule:
        credential: "{{ credential }}"
        vfid: -1
        rules: "{{ myrule }}"
      check_mode: true
      register: rules_changed

      # - debug: var=rules_changed

    - name: Notify activate dummy policy when rules would change
      ansible.builtin.set_fact:
        _notify_activate_dummy: true
      changed_when: true
      notify: Activate dummy policy with empty list of rules
      when: rules_changed.changed # noqa: no-handler

    - name: Flush handlers so dummy policy runs before creating rules
      ansible.builtin.meta: flush_handlers

    - name: Create my rules
      brocade.fos.brocade_maps_rule:
        credential: "{{ credential }}"
        vfid: -1
        rules: "{{ myrule }}"

    - name: Create my policy
      brocade.fos.brocade_maps_maps_policy:
        credential: "{{ credential }}"
        vfid: -1
        maps_policies: "{{ mypolicy }}"

  handlers:
    - name: Activate dummy policy with empty list of rules
      brocade.fos.brocade_maps_maps_policy:
        credential: "{{ credential }}"
        vfid: -1
        maps_policies:
          - name: Dummy_policy
            is_active_policy: true
            rule_list:
              rule: "{{ rules_changed.remain_brocade_maps_rule }}"
