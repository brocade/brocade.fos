- name: Disable access gateway mode
  hosts: fos_switches
  gather_facts: false

  tasks:
    - name: Disable switch before disabling ag mode
      brocade.fos.brocade_fibrechannel_switch:
        credential: "{{ credential }}"
        vfid: -1
        switch:
          enabled_state: false

    - name: Disable ag mode. switch will reboot afterward.
      brocade.fos.brocade_fibrechannel_switch:
        credential: "{{ credential }}"
        vfid: -1
        switch:
          ag_mode: 1
