- name: Show operation status
  hosts: fos_switches
  gather_facts: false

  vars:
    show_status:
      message_id: 20000

  tasks:
    - name: Show status
      brocade.fos.brocade_operation_show_status:
        credential: "{{ credential }}"
        vfid: -1
        show_status: "{{ show_status }}"
      register: result
      until: >
        result.operation_resp is not defined or
        result.operation_resp.show_status.status == "done" or
        result.operation_resp.show_status.status == "delivered"
      retries: 100
      delay: 10

    - name: Print ansible_facts gathered
      ansible.builtin.debug:
        var: result.operation_resp
