- name: Upload switch configuration
  hosts: fos_switches
  gather_facts: false

  vars:
    configupload:
      config_upload_download_option: "virtual-fabric"

  tasks:
    - name: Configupload
      brocade.fos.brocade_scalar_operation:
        credential: "{{ credential }}"
        module_name: "configupload"
        vfid: -1
        entries: "{{ configupload }}"
      register: result

    - name: Print results gathered
      ansible.builtin.debug:
        var: result.operation_resp
