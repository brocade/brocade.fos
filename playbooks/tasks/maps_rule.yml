- name: Configure MAPS rule
  hosts: fos_switches
  gather_facts: false

  tasks:
    - name: Create my rules
      brocade.fos.brocade_maps_rule:
        credential: "{{ credential }}"
        vfid: -1
        rules:
          - name: My_rule1
            actions:
              action:
                - "raslog"
            event_severity:
            group_name: "ALL_E_PORTS"
            is_rule_on_rule: false
            logical_operator: "g"
            monitoring_system: "C3TXTO"
            quiet_time: 0
            threshold_value: 1
            time_base: "Min"
          - name: My_rule2
            actions:
              action:
                - "raslog"
            event_severity:
            group_name: "ALL_E_PORTS"
            is_rule_on_rule: false
            logical_operator: "g"
            monitoring_system: "C3TXTO"
            quiet_time: 0
            threshold_value: 1
            time_base: "Min"
