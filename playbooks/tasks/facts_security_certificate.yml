- name: Gather security certificate facts
  hosts: fos_switches
  gather_facts: false

  tasks:
    - name: Gather facts
      brocade.fos.brocade_facts:
        credential: "{{ credential }}"
        vfid: -1
        gather_subset:
          - brocade_security_security_certificate

    - name: Print ansible_facts gathered
      ansible.builtin.debug:
        var: ansible_facts
