- name: Configure access gateway policy
  hosts: fos_switches
  gather_facts: false

  vars:
    policy:
      auto_policy_enabled: false
      port_group_policy_enabled: true

  tasks:
    - name: Ag policy
      brocade.fos.brocade_access_gateway_policy:
        credential: "{{ credential }}"
        vfid: -1
        policy: "{{ policy }}"
