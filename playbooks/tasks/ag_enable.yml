- name: Enable access gateway mode
  hosts: fos_switches
  gather_facts: false

  tasks:
    - name: Switch disabled
      brocade_fibrechannel_switch:
        credential: "{{ credential }}"
        vfid: -1
        switch:
          enabled_state: false

    - name: Ag mode enabled. if changing, switch will reboot afterward.
      brocade_fibrechannel_switch:
        credential: "{{ credential }}"
        vfid: -1
        switch:
          ag_mode: 3

    - name: Switch enabled
      brocade_fibrechannel_switch:
        credential: "{{ credential }}"
        vfid: -1
        switch:
          enabled_state: true
