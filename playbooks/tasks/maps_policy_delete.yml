- name: Delete MAPS policy
  hosts: fos_switches
  gather_facts: false

  tasks:
    - name: Delete my policy
      brocade.fos.brocade_list_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-maps"
        list_name: "maps-policy"
        throttle: 5
        timeout: 300
        delete_entries:
          - name: My_policy
