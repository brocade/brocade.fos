- name: Apply security crypto config template
  hosts: fos_switches
  gather_facts: false

  vars:
    action_inputs:
      template_name: default_generic
      action: apply

  tasks:
    - name: Apply template. warning - this task will always change.
      brocade.fos.brocade_security_sec_crypto_cfg_template_action:
        credential: "{{ credential }}"
        vfid: -1
        action_inputs: "{{ action_inputs }}"
