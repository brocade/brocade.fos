- name: Import SSH public key
  hosts: fos_switches
  gather_facts: false

  vars:
    action_inputs:
      remote_user_name: user_name
      remote_host_ip: "198.51.100.254"
      remote_user_password: password
      remote_directory: /home/user_name/.ssh
      user_name: admin
      public_key_name: id_rsa.pub
      action: import
      protocol: sftp

  tasks:
    - name: Import public key. Existing public key is not compared. The task will
        always change.
      brocade_security_sshutil_public_key_action:
        credential: "{{ credential }}"
        vfid: -1
        action_inputs: "{{ action_inputs }}"
